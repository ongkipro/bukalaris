# Local development only. Host port 5442 (5432/5433 are used by other projects).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bukalaris
      POSTGRES_PASSWORD: bukalaris # local dev placeholder, not a secret
      POSTGRES_DB: bukalaris
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/init-dbs.sql:/docker-entrypoint-initdb.d/10-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bukalaris -d bukalaris"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
