# Local development only. Host port 5442 (5432/5433 are used by other projects).
# Fixed project name: the container is bukalaris-db-1 and the network bukalaris_default from any
# git worktree, which scripts/*.sh and the images' smoke test rely on.
name: bukalaris
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bukalaris
      POSTGRES_PASSWORD: bukalaris # local dev placeholder, not a secret
      POSTGRES_DB: bukalaris
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Fresh volume only: roles (owner/app/platform, placeholder passwords) then databases.
      # An existing volume gets the roles from the test setups or scripts/db-roles.sh.
      - ./packages/db/docker/05-roles.sql:/docker-entrypoint-initdb.d/05-roles.sql:ro
      - ./packages/db/docker/10-dbs.sql:/docker-entrypoint-initdb.d/10-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bukalaris -d bukalaris"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
