      - product_ids
      - status
      properties:
        expected_revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
        product_ids:
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
            examples:
            - '1042'
        status:
          type: string
          enum:
          - draft
          - published
          - archived
    PageEdit:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - title
      - slug
      - body_markdown
      - status
      properties:
        expected_revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
        body_markdown:
          type: string
          maxLength: 100000
        status:
          type: string
          enum:
          - draft
          - published
          - archived
    MenuEdit:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - name
      - items
      properties:
        expected_revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
    StoreSettingsEdit:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - name
      - description
      - support_email
      - enabled_payment_method_ids
      - enabled_delivery_method_ids
      properties:
        expected_revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        support_email:
          type: string
          format: email
        enabled_payment_method_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        enabled_delivery_method_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
    ThemeEdit:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - theme
      - accent_color
      - logo_media_id
      properties:
        expected_revision:
          type: integer
          minimum: 1
        theme:
          type: string
          enum:
          - responsive
          - mobile-480
        accent_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        logo_media_id:
          type:
          - string
          - 'null'
    CheckoutHandoffInput:
      type: object
      additionalProperties: false
      description: Implemented as an empty object. The return destination is the channel's
        registered origin + return path; the client cannot choose it.
      properties: {}
    CheckoutHandoff:
      type: object
      additionalProperties: false
      properties:
        checkout_id:
          type: string
          minLength: 1
        checkout_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      required:
      - checkout_id
      - checkout_url
      - expires_at
    HostedCheckout:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        cart:
          $ref: '#/components/schemas/Cart'
        status:
          type: string
          enum:
          - open
          - submitting
          - pending
          - completed
          - expired
        return_url:
          type: string
          format: uri
      required:
      - id
      - cart
      - status
      - return_url
    StorefrontChannelInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        storefront_origin:
          type: string
          format: uri
        return_path:
          type: string
          pattern: ^/(?!/)\S*$
          default: /
          description: Single local path appended to storefront_origin for the post-checkout return link.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional; a channel without expiry stays valid until revoked.
      required:
      - name
      - storefront_origin
    StorefrontChannel:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        store_id:
          type: string
          minLength: 1
        storefront_origin:
          type: string
          format: uri
        return_path:
          type: string
        status:
          type: string
          enum:
          - active
          - revoked
          - expired
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        token_prefix:
          type: string
          minLength: 1
          description: 8 base64url characters; the list shows blsk_<prefix>_… only.
      required:
      - id
      - name
      - store_id
      - storefront_origin
      - return_path
      - status
      - expires_at
      - token_prefix
    StorefrontChannelCreated:
      type: object
      additionalProperties: false
      properties:
        channel:
          $ref: '#/components/schemas/StorefrontChannel'
        token:
          type: string
          writeOnly: false
          description: Server-side secret returned once. Never persisted in plaintext
            logs or ordinary responses.
      required:
      - channel
    StorefrontChannelList:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StorefrontChannel'
      required:
      - data
