openapi: 3.1.1
info:
  title: Bukalaris proposed Phase 1 API
  version: 0.1.0-draft
  description: 'DRAFT contract, not deployed. Initial surfaces: Seller Admin, Super
    Admin,

    first-party and independently hosted storefronts, plus a standalone Bukalaris

    hosted checkout. Relative /api/v1 routes are proposed. API host is configured
    by

    Bukalaris; external storefront origins do not select tenant scope.


    On verified native store hosts, public storefront reads resolve the host-bound

    store. On the central API host, storefrontToken is mandatory and resolves its

    single store/channel; conflicting verified host and token store is rejected.

    storefrontToken is a server-only credential (for example in Cloudflare secrets),

    never a seller/admin credential. It grants published reads, cart creation and

    checkout handoff only. Per-cart capability is additionally required for existing

    carts. Scope and revocation are checked on every request. Browser-public channel

    tokens are deferred; CORS is not authorization.


    Operator session cookies are Secure HttpOnly host-only with trusted Origin/CSRF

    checks. Seller service credentials are separately scoped. Auth provider login,

    recovery and invite transport remain adapter-dependent. Cookies/header names

    are proposals. No JWT format or framework is selected.


    Cart and order capabilities are opaque scoped secrets, never resource IDs.

    Private responses are no-store. Do not put these capabilities in URLs or logs.

    A distinct short-lived one-use checkout handoff URL exchanges its code for a

    checkout-origin host-only session and redirects to a clean /checkout route.

    Redact the handoff query at every edge/access/application log, serve no third

    party assets before exchange, and set Referrer-Policy: no-referrer. The handoff

    code contains no PII, cart capability or API credential. Expired/replayed codes

    fail safely. Only the hosted checkout session can quote and submit payment.


    Mutation retries use Idempotency-Key. Replay is authenticated before lookup;

    identical retries return the previous result before stale revision rejection.

    Proposed replay retention: 24 hours; permanent checkout/order/provider uniqueness

    prevents financial duplication afterwards. Expected revision mismatches are 409.

    Integer IDR and decimal-string product/variant IDs are mandatory.


    Provider webhook signatures/payloads, auth-adapter endpoints, media binary upload,

    address search, refund/tax policy, LP/MCP, marketplace and affiliate contracts

    remain explicit gaps. This document is a reviewable initial HTTP boundary, not

    a claim of a complete or implemented provider integration.'
servers:
- url: /api/v1
  description: Proposed relative prefix on the authorized console or verified storefront
    origin; no live environment.
tags:
- name: Identity
  description: Read current authenticated principal.
- name: Storefront
  description: Published store-scoped headless content and guest cart creation.
- name: Checkout
  description: Capability-protected single-store cart and checkout.
- name: Seller
  description: Membership-scoped commerce administration.
- name: Super Admin
  description: Explicit platform authority and safe operational diagnostics.
security: []
paths:
  /session:
    servers:
    - url: https://app.bukalaris.com/api/v1
    get:
      operationId: getSession
      summary: Read active identity and memberships
      description: 'Returns the current authenticated identity without credential/session
        material. '
      tags:
      - Identity
      security:
      - sessionCookie: []
      x-status: proposed
      x-tenant-source: platform-session
      responses:
        '200':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /storefront/config:
    servers:
    - url: https://app.bukalaris.com/api/v1
    get:
      operationId: getStorefrontConfig
      summary: Read store presentation and purchase availability
      description: 'Native verified store host or channel-token-derived store; central
        API host requires storefrontToken. Reject mismatched host/token/cart stores.  Published
        projections only. '
      tags:
      - Storefront
      security:
      - {}
      - storefrontToken: []
      x-status: proposed
      x-tenant-source: verified-native-host-or-scoped-channel-token
      responses:
        '200':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /storefront/products:
    servers:
    - url: https://app.bukalaris.com/api/v1
    get:
      operationId: listStorefrontProducts
      summary: List published products
      description: 'Native verified store host or channel-token-derived store; central
        API host requires storefrontToken. Reject mismatched host/token/cart stores.  Published
        projections only. '
      tags:
      - Storefront
      security:
      - storefrontToken: []
      x-status: proposed
      x-implemented: 'GET /api/storefront/v1/products (M2 channels track, apps/web/src/app/api/storefront/v1/**). Channel token required; the token resolves the store. Returns {items:[PublicProductSummary]}; no pagination, search or collection filter yet.'
      x-tenant-source: verified-native-host-or-scoped-channel-token
      responses:
        '200':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /storefront/products/{slug}:
    servers:
    - url: https://app.bukalaris.com/api/v1
    get:
      operationId: getStorefrontProduct
      summary: Resolve product slug or historical alias
      description: Native verified store host or channel-token-derived store; central
        API host requires storefrontToken. Reject mismatched host/token/cart stores.  Published
        projections only. Historical aliases return the same product with its current
        canonical_path; storefront HTML route redirects to that canonical path without
        chains.
      tags:
      - Storefront
      security:
      - storefrontToken: []
      x-status: proposed
      x-implemented: 'GET /api/storefront/v1/products/{slug} (M2 channels track, apps/web/src/app/api/storefront/v1/**). Channel token required; the token resolves the store. slug is the canonical slug or the numeric id; historical aliases are not implemented.'
      x-tenant-source: verified-native-host-or-scoped-channel-token
      responses:
        '200':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
  /storefront/collections:
    servers:
    - url: https://app.bukalaris.com/api/v1
    get:
      operationId: listStorefrontCollections
      summary: List published collections
      description: 'Native verified store host or channel-token-derived store; central
        API host requires storefrontToken. Reject mismatched host/token/cart stores.  Published
        projections only. '
      tags:
      - Storefront
      security:
      - {}
      - storefrontToken: []
      x-status: proposed
      x-tenant-source: verified-native-host-or-scoped-channel-token
      responses:
        '200':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCollectionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /storefront/pages/{slug}:
    servers:
    - url: https://app.bukalaris.com/api/v1
    get:
      operationId: getStorefrontPage
      summary: Read published ordinary CMS page
      description: 'Native verified store host or channel-token-derived store; central
        API host requires storefrontToken. Reject mismatched host/token/cart stores.  Published
        projections only. '
      tags:
      - Storefront
      security:
      - {}
      - storefrontToken: []
      x-status: proposed
      x-tenant-source: verified-native-host-or-scoped-channel-token
      responses:
        '200':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
  /storefront/carts:
    servers:
    - url: https://app.bukalaris.com/api/v1
    post:
      operationId: createCart
      summary: Create a host-bound guest cart
      description: Native verified store host or channel-token-derived store; central
        API host requires storefrontToken. Reject mismatched host/token/cart stores.  Published
        projections only. Response is private/no-store. Capability is high-entropy,
        server-generated and expires with the cart. Configure trusted browser origins
        and rate limits. An identical creation retry returns the same capability/result
        within the replay window.
      tags:
      - Storefront
      security:
      - storefrontToken: []
      x-status: proposed
      x-implemented: 'POST /api/storefront/v1/carts (M2 channels track, apps/web/src/app/api/storefront/v1/**). Channel token required; the token resolves the store. items may be empty. The cart id (random UUID) together with the channel token is the cart capability (DECISIONS D-6); no separate cart_capability and no Idempotency-Key yet.'
      x-tenant-source: verified-native-host-or-scoped-channel-token
      responses:
        '201':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartCreate'
  /storefront/carts/{cart_id}:
    servers:
    - url: https://app.bukalaris.com/api/v1
    get:
      operationId: getCart
      summary: Read server-priced cart
      description: 'Native verified store host or channel-token-derived store; central
        API host requires storefrontToken. Reject mismatched host/token/cart stores.
        Host store, cart ownership and unexpired cart capability must all match. '
      tags:
      - Checkout
      security:
      - storefrontToken: []
      x-status: proposed
      x-implemented: 'GET /api/storefront/v1/carts/{cart_id} (M2 channels track, apps/web/src/app/api/storefront/v1/**). Channel token required; the token resolves the store. 404 cart_not_found for a foreign-store or checked-out cart.'
      x-tenant-source: verified-native-host-or-scoped-channel-token
      responses:
        '200':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: cart_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
  /storefront/carts/{cart_id}/items:
    servers:
    - url: https://app.bukalaris.com/api/v1
    post:
      operationId: addCartItem
      summary: Add a store-owned variant
      description: 'Native verified store host or channel-token-derived store; central
        API host requires storefrontToken. Reject mismatched host/token/cart stores.
        Host store, cart ownership and unexpired cart capability must all match. '
      tags:
      - Checkout
      security:
      - storefrontToken: []
      x-status: proposed
      x-implemented: 'POST /api/storefront/v1/carts/{cart_id}/items (M2 channels track, apps/web/src/app/api/storefront/v1/**). Channel token required; the token resolves the store. Adds quantity to the variant line (max 99). No revision check or Idempotency-Key yet.'
      x-tenant-source: verified-native-host-or-scoped-channel-token
      responses:
        '200':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: cart_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemAdd'
  /storefront/carts/{cart_id}/items/{item_id}:
    servers:
    - url: https://app.bukalaris.com/api/v1
    patch:
      operationId: updateCartItem
      summary: Change quantity or remove with zero
      description: 'Native verified store host or channel-token-derived store; central
        API host requires storefrontToken. Reject mismatched host/token/cart stores.
        Host store, cart ownership and unexpired cart capability must all match. '
      tags:
      - Checkout
      security:
      - storefrontToken: []
      x-status: proposed
      x-implemented: 'PATCH /api/storefront/v1/carts/{cart_id}/items/{item_id} (M2 channels track, apps/web/src/app/api/storefront/v1/**). Channel token required; the token resolves the store. item_id is the variant id (one line per variant). quantity 0 removes the line.'
      x-tenant-source: verified-native-host-or-scoped-channel-token
      responses:
        '200':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: cart_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: item_id
        in: path
        required: true
        description: The variant id of the line (implemented; one line per variant).
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemEdit'
  /storefront/orders/{order_id}/outcome:
    servers:
    - url: https://app.bukalaris.com/api/v1
    get:
      operationId: getOrderOutcome
      summary: Read safe checkout and payment outcome
      description: Native verified store host or channel-token-derived store; central
        API host requires storefrontToken. Reject mismatched host/token/cart stores.
        Host store and unexpired order-outcome capability must match. Response excludes
        buyer contact/address. Polling does not trigger a new payment. Capability
        issuance/expiry/recovery must be fixed before launch. Never authorize with
        order ID alone.
      tags:
      - Checkout
      security:
      - outcomeCapability: &id004 []
      - outcomeCapability: *id004
        storefrontToken: []
      x-status: proposed
      x-tenant-source: verified-native-host-or-scoped-channel-token
      responses:
        '200':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
  /seller/stores/{store_id}/products:
    servers:
    - url: https://app.bukalaris.com/api/v1
    get:
      operationId: listSellerProducts
      summary: List seller products including drafts
      description: 'Explicit store path is a selector, never authority. Enforce current
        membership or single-store service scope and operation capability. '
      tags:
      - Seller
      security:
      - sessionCookie: []
      - serviceToken: []
      x-status: proposed
      x-tenant-source: authorized-store-path
      responses:
        '200':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-capability: catalog.read
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    post:
      operationId: createProduct
      summary: Create draft with numeric identity and slug
      description: Explicit store path is a selector, never authority. Enforce current
        membership or single-store service scope and operation capability. Generate
        a globally unique positive integer ID and serialize it as a decimal string.
        Default slug equals this ID. Persist ID, route claim and replay record atomically.
      tags:
      - Seller
      security:
      - sessionCookie: []
      - serviceToken: []
      x-status: proposed
      x-tenant-source: authorized-store-path
      responses:
        '201':
          description: Successful result.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
              description: Safe support reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-capability: catalog.write
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
