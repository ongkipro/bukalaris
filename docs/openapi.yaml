components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-bukalaris_session
      description: Proposed server-side browser session; actual adapter pending. Mutations
        require CSRF and Origin checks.
    serviceToken:
      type: http
      scheme: bearer
      description: Proposed revocable opaque service credential, bound to one store
        and explicit operations. Seller API only.
    cartCapability:
      type: apiKey
      in: header
      name: X-Cart-Capability
      description: Opaque secret scoped to one cart, store, expiry and cart/checkout
        operations.
    outcomeCapability:
      type: apiKey
      in: header
      name: X-Order-Capability
      description: Separate opaque read-only capability scoped to one store/order
        outcome.
    storefrontToken:
      type: http
      scheme: bearer
      description: Proposed revocable private storefront channel token; one store,
        published reads/cart/handoff scopes only. Server-side storage required; cannot
        call Seller or Admin APIs.
    checkoutSession:
      type: apiKey
      in: cookie
      name: __Host-bukalaris_checkout
      description: Proposed host-only HttpOnly checkout session established by one-use
        handoff. Bound to store, cart, channel and checkout; submit requires trusted
        Origin and CSRF.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: 'Scoped by actor/capability, store and operation. Same key/input
        replays original result; changed input returns 409. Minimum replay retention
        proposal: 24 hours. Financial references remain unique beyond expiry; reconcile
        an uncertain checkout before any new key.'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        minLength: 1
      description: Required for session-cookie mutations, alongside trusted Origin
        validation; not required for bearer service identities. Acquisition depends
        on the selected auth adapter.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Malformed request or invalid host.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication or resource capability missing/expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient capability, invalid CSRF/origin, or suspended store.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource absent or outside caller store; do not reveal cross-store
        existence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Stale revision, state conflict, duplicate slug/domain, or idempotency
        key with different input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Field or business rule validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded. Retry only after Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Seconds before retry.
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: Unexpected failure; use correlation ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Dependency unavailable; existing operation may be pending, never
        assume failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - correlation_id
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id:
          type: string
          minLength: 1
          maxLength: 128
        field_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    Money:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      properties:
        amount:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
          - IDR
    RevisionInput:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      properties:
        expected_revision:
          type: integer
          minimum: 1
    ProductCreate:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    ProductEdit:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      properties:
        expected_revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 20000
    ProductSlugInput:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - slug
      properties:
        expected_revision:
          type: integer
          minimum: 1
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
    VariantInput:
      type: object
      additionalProperties: false
      required:
      - title
      - price
      - weight_grams
      - inventory_policy
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        sku:
          type: string
          maxLength: 100
        price:
          $ref: '#/components/schemas/Money'
        weight_grams:
          type: integer
          minimum: 1
        inventory_policy:
          type: string
          enum:
          - deny_when_empty
          - allow_backorder
    VariantEdit:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      properties:
        expected_revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        sku:
          type: string
          maxLength: 100
        price:
          $ref: '#/components/schemas/Money'
        weight_grams:
          type: integer
          minimum: 1
        inventory_policy:
          type: string
          enum:
          - deny_when_empty
          - allow_backorder
    Variant:
      type: object
      additionalProperties: false
      required:
      - id
      - product_id
      - revision
      - title
      - price
      - weight_grams
      - inventory_policy
      - available_quantity
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          examples:
          - '1042'
        product_id:
          type: string
          pattern: ^[1-9][0-9]*$
          examples:
          - '1042'
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        sku:
          type: string
          maxLength: 100
        price:
          $ref: '#/components/schemas/Money'
        weight_grams:
          type: integer
          minimum: 1
        inventory_policy:
          type: string
          enum:
          - deny_when_empty
          - allow_backorder
        available_quantity:
          type: integer
          minimum: 0
    Product:
      type: object
      additionalProperties: false
      required:
      - id
      - slug
      - title
      - description
      - status
      - revision
      - variants
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          examples:
          - '1042'
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - draft
          - active
          - archived
        revision:
          type: integer
          minimum: 1
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
    PublicVariant:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - price
      - available
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          examples:
          - '1042'
        title:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean
    PublicProduct:
      type: object
      additionalProperties: false
      required:
      - id
      - slug
      - canonical_path
      - title
      - description
      - variants
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          examples:
          - '1042'
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
        canonical_path:
          type: string
        title:
          type: string
        description:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/PublicVariant'
    Inventory:
      type: object
